<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/assets/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <title>Page Not Found · Guild Saga Heroes Analytics</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0d0f;
        --surface: #111114;
        --border: rgba(255, 255, 255, 0.115);
        --line: rgba(255, 255, 255, 0.075);
        --text: #ededf2;
        --muted: #a6a5b1;
        --faint: #777682;
        --accent: #668a95;
        --accent-soft: #789aa3;
        --focus-ring: #88a8b1;
        --max: 1480px;
        --gutter: clamp(14px, 2.2vw, 32px);
      }

      * { box-sizing: border-box; }
      html { background: var(--bg); }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a { color: inherit; }

      .site-header {
        border-bottom: 1px solid var(--line);
        background: rgba(13, 13, 15, 0.96);
      }

      .header-inner {
        width: min(var(--max), calc(100vw - var(--gutter) - var(--gutter)));
        height: 68px;
        margin: 0 auto;
        display: flex;
        align-items: center;
      }

      .brand {
        display: inline-flex;
        align-items: flex-start;
        gap: 14px;
        text-decoration: none;
      }

      .brand-mark {
        width: 52px;
        height: 52px;
        flex: 0 0 auto;
        overflow: hidden;
        background: var(--surface);
        box-shadow: inset 0 0 0 1px #4a4a4a;
      }

      .brand-mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        image-rendering: pixelated;
      }

      .brand-copy { padding-top: 0; }
      .brand-copy strong {
        display: block;
        font-size: 18px;
        line-height: 1.05;
        white-space: nowrap;
      }
      .brand-copy small {
        display: block;
        margin-top: 2px;
        color: #8b8b8b;
        font-size: 13px;
        line-height: 1.15;
      }

      .error-shell {
        width: min(760px, calc(100vw - var(--gutter) - var(--gutter)));
        min-height: calc(100vh - 69px);
        margin: 0 auto;
        padding: clamp(56px, 12vh, 128px) 0 72px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent-soft);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 7vw, 58px);
        line-height: 1.02;
        letter-spacing: -0.035em;
      }

      .message {
        max-width: 540px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: clamp(16px, 2.2vw, 18px);
        line-height: 1.55;
      }

      .actions {
        margin-top: 30px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .primary-action {
        min-height: 42px;
        padding: 0 17px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(120, 154, 163, 0.58);
        border-radius: 7px;
        background: #1c2a2e;
        color: #f3f4f6;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: border-color 0.16s ease, background 0.16s ease;
      }

      .primary-action:hover {
        border-color: var(--accent-soft);
        background: #223237;
      }

      .primary-action:focus-visible,
      .brand:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
      }

      .rule {
        width: 100%;
        height: 1px;
        margin-top: clamp(48px, 8vh, 76px);
        background: var(--line);
      }

      .hint {
        margin: 15px 0 0;
        color: var(--faint);
        font-size: 12px;
        line-height: 1.5;
      }

      @media (max-width: 780px) {
        .brand-mark { width: 44px; height: 44px; }
        .brand-copy strong { font-size: 17px; }
        .brand-copy small { display: none; }
        .error-shell {
          min-height: calc(100vh - 69px);
          padding-top: 54px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .primary-action { transition: none; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="Guild Saga Heroes Analytics home">
          <span class="brand-mark" aria-hidden="true">
            <img src="/assets/heroes/0-face-pfp.png" alt="" />
          </span>
          <span class="brand-copy">
            <strong>Guild Saga Heroes</strong>
            <small>Analytics</small>
          </span>
        </a>
      </div>
    </header>

    <main class="error-shell">
      <p class="eyebrow">404</p>
      <h1>Page not found</h1>
      <p class="message">
        The page you were looking for isn’t here. It may have moved, or the address may be incorrect.
      </p>
      <div class="actions">
        <a class="primary-action" href="/">Back to analytics</a>
      </div>
      <div class="rule" aria-hidden="true"></div>
      <p class="hint">Guild Saga Heroes Analytics</p>
    </main>
  </body>
</html>
