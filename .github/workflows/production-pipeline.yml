name: Production data pipeline

run-name: >-
  Production data pipeline · ${{ github.event_name == 'repository_dispatch' && 'Cloudflare cron' || github.event_name }}

on:
  repository_dispatch:
    types: [production_cron]
  workflow_dispatch:

# Automatic production may be entered only by the exact repository_dispatch
# event emitted by the Cloudflare Cron Trigger. Manual dispatch remains dry-run only.
concurrency:
  group: guild-saga-production-pipeline
  cancel-in-progress: false

jobs:
  manual-dry-run:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      checks: read
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile production Python
        run: python -m compileall -q collector scripts tests
      - name: Execute non-mutating production dry run
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/production_pipeline.py --mode dry-run

  production-release:
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'production_cron'
    permissions:
      contents: write
      checks: read
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure release commit identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile production Python
        run: python -m compileall -q collector scripts tests
      - name: Execute production release
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          HELIUS_WEBHOOK_AUTH: ${{ secrets.HELIUS_WEBHOOK_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/production_pipeline.py --mode production
