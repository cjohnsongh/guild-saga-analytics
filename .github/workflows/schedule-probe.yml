name: GitHub schedule probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Print safe scheduler diagnostics
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          printf 'utc_timestamp=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'github.event_name=%s\n' "$EVENT_NAME"
          printf 'github.ref=%s\n' "$EVENT_REF"
          printf 'github.sha=%s\n' "$EVENT_SHA"
